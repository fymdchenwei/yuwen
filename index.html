<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>每日15分钟 · 语文学习</title>
  <meta name="description" content="每天 15 分钟语文练习。古诗词闯关、错题本和徽章。">
  <meta name="theme-color" content="#6D4BD6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="每日十五分钟">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="sky" aria-hidden="true">
    <i class="moon"></i>
    <i class="cloud c1"></i>
    <i class="cloud c2"></i>
    <i class="twinkle t1"></i>
    <i class="twinkle t2"></i>
    <i class="twinkle t3"></i>
    <i class="twinkle t4"></i>
    <i class="bloom b1"></i>
    <i class="bloom b2"></i>
  </div>
  <div id="main" class="main"></div>
  <nav id="rail" class="rail" aria-label="主导航"></nav>
  <nav id="tab" class="tabbar" aria-label="主导航"></nav>
  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
