<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>正在打开每日15分钟</title>
  <meta http-equiv="refresh" content="0;url=../">
  <script>
    (function () {
      var path = location.pathname.replace(/\/app(?:\/.*)?$/, "/");
      if (path.slice(-1) !== "/") path += "/";
      var next = path + location.search + location.hash;
      if (location.pathname + location.search + location.hash !== next) location.replace(next);
    })();
  </script>
</head>
<body>
  <p>学习应用已搬到首页。<a href="../">点这里打开</a></p>
  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");
  </script>
</body>
</html>
